[project]
name = "netsim"
version = "0.9.0"
description = "NetSim authoritative network simulation core"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["python/tests", "python-tools/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP035", "UP042"]

# Static typing is enforced over the simulation engine and the python-tools utilities.
# Run with: .venv/bin/mypy
# `disallow_untyped_defs` is on because every def in python/netsim/ is fully annotated; the
# pytest modules are exempted below (unannotated fixture parameters are conventional in tests
# and annotating them would add no safety).
[tool.mypy]
python_version = "3.11"
files = ["python/netsim", "python-tools"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

# The pytest modules live in python-tools/tests/ without an __init__.py, so mypy resolves them
# as top-level modules and each has to be named individually. Add new test modules here.
[[tool.mypy.overrides]]
module = [
    "conftest",
    "test_analyze_results",
    "test_cli",
    "test_engine_schema",
    "test_plot_metrics",
]
disallow_untyped_defs = false
