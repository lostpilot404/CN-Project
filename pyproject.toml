[project]
name = "netsim"
version = "0.9.0"
description = "NetSim authoritative network simulation core"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP035", "UP042"]
