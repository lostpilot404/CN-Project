[package]
name = "netsim"
version = "0.1.0"
description = "Interactive Computer Network Simulator"
authors = ["NetSim Team"]
edition = "2021"

[lib]
name = "netsim_lib"
crate-type = ["rlib"]

[[bin]]
name = "netsim"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tempfile = "3.10"

[dev-dependencies]
tempfile = "3.10"
